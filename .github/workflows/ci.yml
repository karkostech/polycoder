name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        # 27 unit + e2e tests; fully offline (mock provider), git is preinstalled on runners
        run: npm test

      - name: Smoke test CLI (offline demo pipeline)
        shell: bash
        run: |
          set -e
          SANDBOX="$(mktemp -d)"
          cd "$SANDBOX"
          node "$GITHUB_WORKSPACE/dist/src/cli.js" init --demo
          node "$GITHUB_WORKSPACE/dist/src/cli.js" doctor
          node "$GITHUB_WORKSPACE/dist/src/cli.js" run
          test -f web/index.html
          test -f server/server.js
          test -f db/db.js
          ls .agents/report-*.md
          rm -rf "$SANDBOX"
          echo "CLI smoke test OK"
